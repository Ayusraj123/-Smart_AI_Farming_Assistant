services:
  db:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_farming}
      POSTGRES_USER: ${POSTGRES_USER:-farming_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-farming_password}

    ports:
      - "5432:5432"

    volumes:
      - pg:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U farming_user -d smart_farming"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend

    environment:
      DATABASE_URL: postgresql+psycopg://farming_user:farming_password@db:5432/smart_farming

      JWT_SECRET: ${JWT_SECRET:-change-me}

      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      OPENWEATHER_UNITS: metric

      UPLOAD_DIR: /app/uploads

      MODEL_PATH: /app/weights/disease_model.pt
      CLASSES_PATH: /app/weights/classes.json

      CORS_ORIGINS: http://localhost:5173

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

    command:
      - sh
      - -c
      - uvicorn app.main:app --host 0.0.0.0 --port 8000

    volumes:
      - uploads:/app/uploads
      - ./backend/weights:/app/weights
      - ./backend/data/plantvillage:/app/data/plantvillage

  frontend:
    image: node:20-alpine

    working_dir: /app

    volumes:
      - ./frontend:/app

    environment:
      VITE_API_URL: http://localhost:8000/api

    ports:
      - "5173:5173"

    command:
      - sh
      - -c
      - npm install && npm run dev -- --host 0.0.0.0

    depends_on:
      - backend

volumes:
  pg:
  uploads: